name: PRD Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.html"
      - "scripts/validate_prd_assets.py"
      - ".github/workflows/prd-lint.yml"

jobs:
  validate-prd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate LaViC Story1 assets
        run: |
          python3 scripts/validate_prd_assets.py \
            --md PRD_LaViC_MCP_Story1.md \
            --html prd-lavic-mcp-story1.html
