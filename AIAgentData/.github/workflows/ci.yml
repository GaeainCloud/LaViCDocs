name: AIAgentData CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile src/*.py

      - name: Validate AgentData Schema
        run: python src/validate_all.py

      - name: Check Pipeline Orchestrator
        run: python src/cli.py pipeline -- --pipeline validate --dry-run
